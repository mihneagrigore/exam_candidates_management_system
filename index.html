<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colegiul Național Grigore Moisil</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            background-color: #972222;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
        }

        h2 {
            font-size: 1.5em;
            margin-top: 10px;
            font-weight: 300;
        }

        section {
            max-width: 900px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h3 {
            font-size: 1.8em;
            color: #004080;
            border-bottom: 2px solid #004080;
            padding-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            color: #555;
        }

        /* Flexbox for buttons */
        ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        li {
            margin: 0;
        }

        a {
            display: inline-block;
            background-color: #004080;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #002d59;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 1.2em;
            }

            section {
                margin: 20px;
                padding: 20px;
            }

            /* Stack buttons vertically on smaller screens */
            ul {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Colegiul Național Grigore Moisil Bucuresti</h1>
        <h2>Platforma de inscriere pentru admiterea in ciclul gimnazial</h2>
    </header>

    <section>
        <h3>Admitere clasa a V-a</h3>
        <p>An școlar 2024-2025</p>
        
        <ul>
            <li><a href="https://admitere.moisil.ro/inscriere.php">Înscriere</a></li>
            <li><a href="https://admitere.moisil.ro/dashboard/modules/submission_accounts/login.php?form_id=1">Verificare stadiu dosar</a></li>
            <li><a href="#">Contestații (în curând)</a></li>
        </ul>
    </section>
</body>
</html>
